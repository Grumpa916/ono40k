name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine regression tests
        run: npx --yes tsx@4.20.6 --test src/lib/engine/p0.test.ts src/lib/p1-bridge.test.ts src/lib/p2-mission.test.ts

      - name: Typecheck
        run: npm run typecheck

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite (diagnostic)
        run: npm test
